name: VIP Bot Fast Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: bot-engine-run
  cancel-in-progress: true

jobs:
  start-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot requests

      - name: Launch Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO || secrets.GITHUB_REPO || github.repository }}
          GITHUB_REPO: ${{ secrets.GH_REPO || secrets.GITHUB_REPO || github.repository }}
          PORT: 8080
        run: |
          python bot.py
