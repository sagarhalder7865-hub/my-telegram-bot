name: 24/7 VIP Telegram Bot Engine

on:
  workflow_dispatch:
  schedule:
    # প্রতি ৫ ঘণ্টা পরপর অটোমেটিক সচল রাখার ট্রিপ
    - cron: '0 */5 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'bot_data.json'
      - 'README.md'

# এই সেটিংয়ের কারণে আর কখনোই Queued হয়ে আটকে থাকবে না (পুরনো রান অটোমেটিক বন্ধ হয়ে যাবে)
concurrency:
  group: telegram-vip-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot requests

      - name: Run Telegram Bot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO || secrets.GITHUB_REPO || github.repository }}
          GITHUB_REPO: ${{ secrets.GH_REPO || secrets.GITHUB_REPO || github.repository }}
          PORT: 8080
        run: |
          python bot.py
